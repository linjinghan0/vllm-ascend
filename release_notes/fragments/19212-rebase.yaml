pr: 19212
entries:
  - category: bugfix
    text: Retained Mooncake Host landing resources after failed NPU waits and deferred receive completion until pending copies were drained.
  - category: bugfix
    text: Rejected overlapping Mooncake V2 Host destinations before starting a receive, including any direct HBM reads in a mixed transfer.
  - category: bugfix
    text: Preserved late Mooncake staging registrations and CPU location hints across sleep and wake cycles, including retries after partial registration failures.
  - category: bugfix
    text: Kept Mooncake DSA configuration optional for direct AscendConfig construction after the upstream config migration.
  - category: feature
    text: Added experimental Mooncake pull support to SfaRemoteD2HConnector with bounded HBM staging into the TP-shared host KV pool; MemFabric remains the default transport.
  - category: feature
    text: Adapted DSA Host KV offload to MooncakeConnectorV2 with ModelRunner V2, preserving bounded staging, pipeline landing, and completion ordering.
  - category: feature
    text: Connected MooncakeConnectorV2 with ModelRunner V2 to the existing SFA Host KV manager and LIM + Copy-SFA backend, preserving pipelined Host landing and directly priming rank-local HBM hot rows and circular tails during PD, without changing the existing SFA connector flow.
  - category: bugfix
    text: Used the native int32 byte-length ABI for SFA dense hot-row initialization while retaining int64 source and destination offsets.
  - category: bugfix
    text: Matched Mooncake V2 hot-row and circular-tail PD initialization to SFA's full received KV extent, while separately restoring history for last-token replay across a block-aligned long prefill.
