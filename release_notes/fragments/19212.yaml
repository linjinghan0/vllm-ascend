pr: 19212
entries:
  - category: bugfix
    text: >-
      Fixed MooncakeConnectorV2 Host KV allocation for DSA/SFA main caches on Model Runner V2.
      Unsupported Host KV layouts now fail explicitly instead of silently using device KV.
  - category: performance
    text: Reused the request staging buffer for DSA Host KV landing without repeating capacity checks for each copy.
  - category: performance
    text: Cached DSA Host KV byte views with lifecycle-aware invalidation to avoid rebuilding them for every landing copy.
  - category: performance
    text: Reused the resolved Host KV target and byte offset from each receive plan during DSA landing.
  - category: performance
    text: Indexed DSA Mooncake buffer ranges to avoid rebuilding and scanning the registry on every address lookup.
  - category: performance
    text: Carried local KV destination metadata through Mooncake V2 receive plans to avoid rediscovering each address classification.
  - category: performance
    text: >-
      Reused bounded zero-copy staging slices and repeated Host KV destination slices
      to reduce DSA Mooncake landing metadata construction.
